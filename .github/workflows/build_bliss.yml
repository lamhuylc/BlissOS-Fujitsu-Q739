name: Remaster Latest BlissOS Pixel-Smooth for Q739

on:
  workflow_dispatch:

jobs:
  remaster:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Cài đặt công cụ xử lý ISO và SquashFS
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full squashfs-tools xorriso isolinux genisoimage wget curl git

      - name: 2. Tự động tải bản ISO Bliss OS mới nhất (có GApps & Kernel mới)
        run: |
          mkdir -p ~/work/iso_src ~/work/iso_extract ~/work/squashfs_root ~/work/out
          cd ~/work/iso_src
          
          # Lấy link tải trực tiếp bản Bliss OS x86_64 GApps mới nhất từ SourceForge
          LATEST_URL=$(curl -sL "https://sourceforge.net/projects/blissos-x86/rss?path=/Official" | \
            grep -oE 'https://sourceforge.net/projects/blissos-x86/files/Official/[^"]+x86_64[^"]+gapps[^"]+\.iso/download' | \
            head -n 1)
          
          if [ -z "$LATEST_URL" ]; then
            LATEST_URL=$(curl -sL "https://sourceforge.net/projects/blissos-x86/rss" | \
              grep -oE 'https://sourceforge.net/projects/blissos-x86/files/[^"]+x86_64[^"]+gapps[^"]+\.iso/download' | \
              head -n 1)
          fi

          echo "Downloading: $LATEST_URL"
          wget -L --user-agent="Mozilla/5.0" -O bliss_base.iso "$LATEST_URL"
          ls -lh bliss_base.iso

      - name: 3. Tải Full Linux Firmware mới nhất cho Fujitsu Q739
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git ~/work/fw
          mkdir -p ~/work/q739_fw
          cp -rn ~/work/fw/intel/* ~/work/q739_fw/ 2>/dev/null || true
          cp -rn ~/work/fw/iwlwifi* ~/work/q739_fw/ 2>/dev/null || true
          cp -rn ~/work/fw/i915/* ~/work/q739_fw/ 2>/dev/null || true
          rm -rf ~/work/fw

      - name: 4. Giải nén ISO, nhúng Driver & Tối ưu mượt kiểu Pixel
        run: |
          cd ~/work
          7z x iso_src/bliss_base.iso -oiso_extract
          
          # Tìm và giải nén file system.sfs hoặc system.img
          if [ -f "iso_extract/system.sfs" ]; then
            sudo unsquashfs -d squashfs_root iso_extract/system.sfs
            if [ -f "squashfs_root/system.img" ]; then
              mkdir -p ~/work/sys_mnt
              sudo mount -o loop squashfs_root/system.img ~/work/sys_mnt
              TARGET_SYS="$HOME/work/sys_mnt"
            else
              TARGET_SYS="$HOME/work/squashfs_root"
            fi
          elif [ -f "iso_extract/system.img" ]; then
            mkdir -p ~/work/sys_mnt
            sudo mount -o loop iso_extract/system.img ~/work/sys_mnt
            TARGET_SYS="$HOME/work/sys_mnt"
          fi

          # Nhúng toàn bộ firmware Intel/Wi-Fi/Audio SOF vào hệ thống
          sudo mkdir -p "$TARGET_SYS/system/lib/firmware" "$TARGET_SYS/vendor/firmware"
          sudo cp -rn ~/work/q739_fw/* "$TARGET_SYS/system/lib/firmware/" 2>/dev/null || true
          sudo cp -rn ~/work/q739_fw/* "$TARGET_SYS/vendor/firmware/" 2>/dev/null || true
          sudo chmod -R 644 "$TARGET_SYS/system/lib/firmware/"* "$TARGET_SYS/vendor/firmware/"* 2>/dev/null || true
          sudo find "$TARGET_SYS/system/lib/firmware" "$TARGET_SYS/vendor/firmware" -type d -exec chmod 755 {} + 2>/dev/null || true

          # Tinh chỉnh build.prop giúp cảm ứng, hiệu ứng chuyển cảnh và GPU UHD 620 mượt như Pixel
          BUILD_PROP=$(sudo find "$TARGET_SYS" -maxdepth 3 -name "build.prop" | head -n 1)
          if [ -n "$BUILD_PROP" ]; then
            sudo bash -c "cat << 'EOF' >> '$BUILD_PROP'

          # --- Tối ưu hiệu năng & độ mượt Pixel cho Fujitsu Q739 ---
          debug.sf.hw=1
          debug.egl.hw=1
          debug.composition.type=gpu
          persist.sys.ui.hw=1
          ro.surface_flinger.vsync_event_phase_offset_ns=2000000
          ro.surface_flinger.vsync_sf_event_phase_offset_ns=6000000
          windowsmgr.max_events_per_sec=150
          ro.min_pointer_dur=8
          touch.pressure.scale=0.001
          persist.sys.scrollingcache=3
          EOF"
          fi

          # Đóng gói lại system.sfs
          if mountpoint -q ~/work/sys_mnt; then
            sudo umount ~/work/sys_mnt
          fi
          if [ -f "iso_extract/system.sfs" ]; then
            sudo rm -f iso_extract/system.sfs
            sudo mksquashfs squashfs_root iso_extract/system.sfs -comp zstd -Xcompression-level 6
          fi

      - name: 5. Xuất file ISO hoàn chỉnh (Hỗ trợ chuẩn UEFI của Q739)
        run: |
          cd ~/work
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "BLISSOS_Q739" \
            -eltorito-boot isolinux/isolinux.bin \
            -eltorito-catalog isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -o out/BlissOS-Fujitsu-Q739-PixelSmooth.iso \
            iso_extract
          ls -lh out/BlissOS-Fujitsu-Q739-PixelSmooth.iso

      - name: 6. Đưa file ISO lên mục tải về
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS-Q739-PixelSmooth-FullDriver
          path: ~/work/out/BlissOS-Fujitsu-Q739-PixelSmooth.iso
          retention-days: 7
