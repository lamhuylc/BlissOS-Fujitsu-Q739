name: Official Git Build BlissOS for Fujitsu Q739

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 1. Giải phóng tối đa dung lượng ổ cứng máy chủ Cloud
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/* /usr/share/swift
          sudo docker image prune --all --force || true
          df -h

      - name: 2. Cài đặt gói thư viện chuẩn theo tài liệu Bliss OS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 squashfs-tools genisoimage xorriso mtools \
            openjdk-11-jdk ccache rsync bc libssl-dev libelf-dev
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/.local/bin/repo
          chmod a+rx ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 3. Khởi tạo & Đồng bộ mã nguồn từ Git chính thức BlissRoms-x86
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false
          mkdir -p ~/blissos && cd ~/blissos

          # Tự động dò nhánh mới nhất trên kho manifest chính thức của BlissRoms-x86
          MANIFEST_URL="https://github.com/BlissRoms-x86/manifest.git"
          BRANCH=""
          for b in arc-14.x arc-13.x typhoon-x86 arc-12.x arc-11.x r11-x86; do
            if git ls-remote --heads "$MANIFEST_URL" "refs/heads/$b" | grep -q "$b"; then
              BRANCH="$b"
              break
            fi
          done

          echo "Selected Official Branch: ${BRANCH:-default}"
          if [ -n "$BRANCH" ]; then
            repo init -u "$MANIFEST_URL" -b "$BRANCH" --depth=1 --no-clone-bundle
          else
            repo init -u "$MANIFEST_URL" --depth=1 --no-clone-bundle
          fi

          # Đồng bộ mã nguồn với số luồng tối ưu tránh nghẽn kết nối
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: 4. Nạp Full Linux Firmware & Cấu hình Driver Fujitsu Q739
        run: |
          cd ~/blissos
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git /tmp/linux-firmware
          mkdir -p device/generic/common/firmware
          cp -rn /tmp/linux-firmware/intel/* device/generic/common/firmware/ 2>/dev/null || true
          cp -rn /tmp/linux-firmware/iwlwifi* device/generic/common/firmware/ 2>/dev/null || true
          cp -rn /tmp/linux-firmware/i915/* device/generic/common/firmware/ 2>/dev/null || true
          rm -rf /tmp/linux-firmware

          # Bật các module nhân Linux cho Intel Gen 8, Âm thanh SOF, Bút Wacom, Cảm biến Fujitsu
          for DEFCONFIG in $(find kernel -name "*x86_64*defconfig"); do
            cat << 'EOF' >> "$DEFCONFIG"
          CONFIG_INTEL_SOC_DPTF=y
          CONFIG_INTEL_POWERCLAMP=y
          CONFIG_X86_INTEL_PSTATE=y
          CONFIG_THERMAL_GOV_POWER_ALLOCATOR=y
          CONFIG_SND_SOC_INTEL_SST=m
          CONFIG_SND_SOC_SOF_TOPLEVEL=y
          CONFIG_SND_SOC_SOF_INTEL_TOPLEVEL=y
          CONFIG_SND_SOC_SOF_INTEL_HDA_COMMON=m
          CONFIG_SND_SOC_SOF_KABYLAKE=m
          CONFIG_SND_SOC_SOF_COFFEELAKE=m
          CONFIG_SND_HDA_CODEC_REALTEK=m
          CONFIG_SND_HDA_INTEL=m
          CONFIG_HID_WACOM=m
          CONFIG_TOUCHSCREEN_WACOM_W8001=m
          CONFIG_TOUCHSCREEN_WACOM_I2C=m
          CONFIG_HID_MULTITOUCH=m
          CONFIG_FUJITSU_TABLET=m
          CONFIG_FUJITSU_LAPTOP=m
          CONFIG_IIO=y
          CONFIG_HID_SENSOR_HUB=m
          CONFIG_HID_SENSOR_ACCEL_3D=m
          CONFIG_HID_SENSOR_GYRO_3D=m
          CONFIG_ACPI_BATTERY=y
          CONFIG_ACPI_BUTTON=y
          CONFIG_IWLWIFI=m
          CONFIG_IWLMVM=m
          CONFIG_BT_INTEL=m
          CONFIG_BT_HCIBTUSB=m
          EOF
          done

      - name: 5. Biên dịch ISO kèm GApps theo script chính thức của Bliss OS
        run: |
          cd ~/blissos
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          export BLISS_BUILD_VARIANT=gapps

          if [ -f "build-x86.sh" ]; then
            chmod +x build-x86.sh
            ./build-x86.sh -g x86_64
          else
            source build/envsetup.sh
            lunch bliss_x86_64-userdebug
            mka iso_img -j$(nproc)
          fi

      - name: 6. Đóng gói file ISO thành phẩm
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS-OfficialGit-Q739-GApps
          path: ~/blissos/out/target/product/x86_64/*.iso
          retention-days: 7
